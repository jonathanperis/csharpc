name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running check (each commit contains the previous
# ones), so runners aren't spent on outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            os: linux
            runner: ubuntu-24.04
          - name: arm64
            os: linux
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos
            runner: macos-15
          - name: windows-x64
            os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash  # Git Bash on Windows: the test scripts are bash
    steps:
      # Test sources and recorded outputs must keep their LF line endings on Windows too.
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 18 and clang (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang-18 libllvm18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang

      # Homebrew's clang 18 (not Apple clang) compiles the runtime, so its LTO bitcode matches the
      # LLVM 18 that csharpc links it into; Apple's ld still links. The test scripts use bash 4+ and
      # GNU coreutils (timeout, stat -c, date +%N).
      - name: Install LLVM 18, bash and GNU coreutils (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install llvm@18 bash coreutils
          llvm="$(brew --prefix llvm@18)"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "CSHARPC_LIBLLVM=$llvm/lib/libLLVM.dylib" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      # LLVM-MinGW: clang (the runtime compiler and linker driver), lld, compiler-rt, libunwind,
      # winpthreads and the UCRT import libraries, plus libLLVM-18.dll for the compiler itself (the
      # same LLVM 18, so the runtime's LTO bitcode matches). Pinned release and checksum.
      - name: Install LLVM-MinGW (Windows)
        if: matrix.os == 'windows'
        run: |
          curl -sSLf -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip
          echo "810703594a7e3eea03385b5329c7ea3bd65f5e496b44cf1b68c17ff436d265e7  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          bin="$(cygpath -w "$RUNNER_TEMP/llvm-mingw-20240619-ucrt-x86_64/bin")"
          echo "$bin" >> "$GITHUB_PATH"
          echo "CSHARPC_LIBLLVM=$bin\\libLLVM-18.dll" >> "$GITHUB_ENV"

      - name: Install .NET 11 SDK
        if: matrix.os != 'windows'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Install .NET 11 SDK (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -JsonFile global.json -InstallDir "$env:USERPROFILE\.dotnet11"
          "$env:USERPROFILE\.dotnet11" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$env:USERPROFILE\.dotnet11" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build
        run: dotnet build src/Csharpc -c Release

      - name: Differential tests (-O0 and -O2)
        run: tests/run.sh --all-opts

      - name: Conformance corpus
        if: success() || failure()
        run: tests/conformance.sh -j 4

      # The adversarial corpus: gated on tests/conformance2/known-failures.txt (new failures and
      # fixed known failures both fail the step). Linux only until its outputs are checked elsewhere.
      - name: Adversarial conformance corpus
        if: (success() || failure()) && matrix.os == 'linux'
        run: tests/conformance2.sh -j 4

      - name: Real-world programs
        if: success() || failure()
        run: tests/programs.sh

      - name: Projects and dotnet build/run/publish integration
        if: success() || failure()
        run: tests/projects.sh

      # The Windows expectations are derived from the Linux recordings ("\r\n" line ends); check that
      # derivation against real .NET on this machine for every test not listed in platform-skips.txt.
      - name: Real .NET vs derived expectations (Windows)
        if: matrix.os == 'windows' && (success() || failure())
        run: tests/check-oracle.sh -j 4

      - name: IL front-end (libraries consumed as DLLs and NuGet packages)
        if: success() || failure()
        run: tests/il.sh

      # tests/debuginfo.sh drives gdb, which isn't available on macOS (lldb would need its own harness)
      # or on Windows (DWARF in PE/COFF; the gdb pretty-printers are untested there).

  # WebAssembly (wasm32-wasip1): every test is compiled for WASI and run under wasmtime, against the
  # expectations recorded with .NET on Linux; tests/platform-skips.txt ("wasi") lists what WebAssembly
  # can't do (docs/adr/0011-wasm32.md). The WASI SDK must be LLVM 18 like csharpc (wasi-sdk 24).
  wasm:
    name: test (wasm32-wasi)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      CSHARPC_TEST_TARGET: wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y llvm-18 libllvm18

      # Pinned releases and checksums: the WASI SDK (clang 18, wasm-ld, wasi-libc, compiler-rt) and the
      # wasmtime LTS line.
      - name: Install the WASI SDK and wasmtime
        run: |
          curl -sSLf -o "$RUNNER_TEMP/wasi-sdk.tar.gz" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          echo "c6c38aab56e5de88adf6c1ebc9c3ae8da72f88ec2b656fb024eda8d4167a0bc5  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          tar xf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-24.0-x86_64-linux" >> "$GITHUB_ENV"
          curl -sSLf -o "$RUNNER_TEMP/wasmtime.tar.xz" https://github.com/bytecodealliance/wasmtime/releases/download/v36.0.19/wasmtime-v36.0.19-x86_64-linux.tar.xz
          echo "c6070b3043023f3b8e8dc3473a4c360c0d6784aa4294f5a6fc803580fcb2c875  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          tar xf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v36.0.19-x86_64-linux" >> "$GITHUB_PATH"

      - name: Install .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build src/Csharpc -c Release

      - name: Differential tests (-O0 and -O2)
        run: tests/run.sh --all-opts

      - name: Conformance corpus
        if: success() || failure()
        run: tests/conformance.sh -j 4

      - name: Adversarial conformance corpus
        if: success() || failure()
        run: tests/conformance2.sh -j 4

      - name: Real-world programs
        if: success() || failure()
        run: tests/programs.sh

      # Root discovery under pressure: a collection at every allocation (CSRT_GC_STRESS=1). Without the
      # compiler's stack spill slots this sample prints wrong totals.
      - name: GC stress
        if: success() || failure()
        run: CSRT_GC_STRESS=1 tests/run.sh --all-opts 310_gc_roots
