name: CI

# Merge bar: the five jobs named `test (<platform>)`. A full run shards the differential suite
# and those jobs fail unless every shard passed and the shards cover every sample at -O0 and -O2
# exactly once. A docs-only push reports the same five names as success without rerunning the
# compiler, but only when an ancestor commit already has them green (tools/ci-plan.sh).
#
# A targeted run (CI-Only trailer or ci/targets on a ci/** branch) is labeled `partial (...)` and
# does not report `test (<platform>)` as success, so it cannot satisfy the merge bar or a release.
# Manual targeted runs are the separate "CI (targeted)" workflow. Dispatching THIS workflow is a
# full gate. `gh workflow run` is 403 from the agent checkout; push a ci/** branch instead.
#
# Shard counts (tools/ci-plan.sh) come from run 40310822368: x86-64 differential 38.5 min and
# windows 49.1 min get 4 shards; arm64 (35.4), macOS (29.5) and wasm (21.5) get 2, because arm
# and macOS runners queue and wasm shares ubuntu-24.04 with x86-64.
on:
  push:
    # ci/** is the long-lived namespace for measurement branches (docs/20-status.md).
    # Also lets those branches run without workflow_dispatch (token lacks actions:write).
    # main's push behaviour is unchanged: every push to main still runs CI.
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

# A newer push to the same branch supersedes the running check. A dispatch does not cancel a push:
# the group includes the event name. A docs-only push still cancels an in-progress full run; the
# replacement then runs the suite, because the parent gate is no longer green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      filter: ${{ steps.plan.outputs.filter }}
      platforms: ${{ steps.plan.outputs.platforms }}
      opt: ${{ steps.plan.outputs.opt }}
      repeat: ${{ steps.plan.outputs.repeat }}
      skip_other: ${{ steps.plan.outputs.skip_other }}
      run_suites: ${{ steps.plan.outputs.run_suites }}
      reason: ${{ steps.plan.outputs.reason }}
      parent_sha: ${{ steps.plan.outputs.parent_sha }}
      diff_matrix: ${{ steps.plan.outputs.diff_matrix }}
      suites_matrix: ${{ steps.plan.outputs.suites_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Self-check the planner
        run: bash tools/ci-plan.sh self-check

      - name: Plan
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
          CI_BEFORE: ${{ github.event.before }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_REPO: ${{ github.repository }}
          CI_COMMIT_MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci-plan.sh emit

  diff:
    name: ${{ matrix.job_name }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.diff_matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          os: ${{ matrix.os }}

      # platform.sh treats only wasm32* as a cross target. A boolean expression in `env:` can
      # stringify to "true", which would silently run the host toolchain.
      - name: Select the WebAssembly target
        if: matrix.os == 'wasm'
        run: echo "CSHARPC_TEST_TARGET=wasm32-wasip1" >> "$GITHUB_ENV"

      - name: Differential shard
        id: shard
        env:
          CI_FILTER: ${{ needs.plan.outputs.filter }}
          CI_OPT: ${{ matrix.opt }}
          CI_SHARD: ${{ matrix.shard }}
          CI_SHARDS: ${{ matrix.shards }}
          CI_REPEAT: ${{ needs.plan.outputs.repeat }}
        run: bash tools/ci-plan.sh run-shard

      - name: Record shard result
        if: always()
        run: |
          if [[ "${{ steps.shard.outcome }}" == "success" ]]; then echo success; else echo failure; fi > result.txt
          [[ -f manifest.txt ]] || : > manifest.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            manifest.txt
            result.txt
          if-no-files-found: error
          retention-days: 3

  suites:
    name: ${{ matrix.job_name }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.run_suites == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.suites_matrix) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          os: ${{ matrix.os }}

      - name: Select the WebAssembly target
        if: matrix.os == 'wasm'
        run: echo "CSHARPC_TEST_TARGET=wasm32-wasip1" >> "$GITHUB_ENV"

      - uses: ./.github/actions/run-suites
        id: suites
        with:
          os: ${{ matrix.os }}

      - name: Record suites result
        if: always()
        run: |
          if [[ "${{ steps.suites.outcome }}" == "success" ]]; then echo success; else echo failure; fi > result.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: result.txt
          if-no-files-found: error
          retention-days: 3

  # These names are the merge bar. They run for a full gate and for a docs-only skip, and they are
  # skipped (not passed) for a partial run. A skipped job is not a successful `test (<platform>)`
  # check: when the job-level `if` is false the matrix is not expanded, so the check name stays the
  # literal template and does not replace a previous green `test (x86-64)`.
  gate:
    name: test (${{ matrix.platform }})
    needs: [plan, diff, suites]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'partial'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [x86-64, arm64, macos-arm64, windows-x64, wasm32-wasi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docs-only
        if: needs.plan.outputs.mode == 'docs'
        run: |
          echo "Docs-only change. The compiler suite did not run."
          echo "Parent gate: ${{ needs.plan.outputs.parent_sha }}"
          echo "Required check 'test (${{ matrix.platform }})' reports success."
          echo "${{ needs.plan.outputs.reason }}"

      - name: Download shard results
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diff-${{ matrix.platform }}-*
          path: shards

      - name: Download suites result
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: suites-${{ matrix.platform }}
          path: suites

      - name: Check shards cover every sample and suites passed
        if: needs.plan.outputs.mode == 'full'
        run: bash tools/ci-plan.sh coverage --diff shards --suites suites/result.txt --samples tests/samples
