name: TechEmpower

# M8 harness (docs/06-roadmap.md): the TechEmpower plaintext/JSON app (benchmarks/techempower/app)
# built with NativeAOT, with csharpc and on the JIT; each build is checked with TechEmpower's test
# requests (csharpc's responses must equal NativeAOT's) and loaded with wrk the way TechEmpower loads
# it (pipelined plaintext, several concurrency levels). Until csharpc can build the app, the report
# carries the NativeAOT/JIT numbers and csharpc's blocker list. Informational: it never gates.
# Builds csharpc from this commit (not the published tool): throughput/size must reflect the tree.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per load run'
        default: '15'
      profile:
        description: 'Sample the NativeAOT and csharpc servers with perf during the 256-connection runs (unstripped builds)'
        type: boolean
        default: false
      only:
        description: 'Builds to run (aot,csharpc,jit)'
        default: 'aot,csharpc,jit'
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the benchmarks
  push:
    paths: ["benchmarks/techempower/**", ".github/workflows/techempower.yml"]

permissions:
  contents: read

concurrency:
  group: techempower-${{ github.ref }}
  cancel-in-progress: true

jobs:
  techempower:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 18, clang, wrk and NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang-18 libllvm18 lld-18 zlib1g-dev wrk && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Install perf
        if: ${{ inputs.profile }}
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-azure linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version

      - name: Runner
        run: |
          {
            echo "## Runner"
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
            free -h | head -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build, verify and load
        run: |
          PROFILE="${{ inputs.profile && '1' || '0' }}" DURATION="${{ inputs.duration || '15' }}" benchmarks/techempower/run.sh --out techempower-results --only "${{ inputs.only || 'aot,csharpc,jit' }}"
          cat techempower-results/results.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: techempower
          path: techempower-results/
