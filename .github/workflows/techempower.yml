name: TechEmpower

# M7 harness (docs/06-roadmap.md, "M7"; benchmarks/techempower/harness.py): TechEmpower's ASP.NET Core
# [Platform] entry (benchmarks/techempower/app, the one TechEmpower publishes with NativeAOT) built with
# NativeAOT, csharpc and the JIT, every test type TechEmpower runs for it at every level it uses, and a
# report with a csharpc-vs-NativeAOT verdict per metric ("M7 finish line: X of Y metrics beat NativeAOT").
# The interim plaintext/JSON app (benchmarks/techempower/interim) is measured alongside, outside the verdict.
#
#   build    one job per app: the three builds, their build times, sizes and minimal runtime images.
#   measure  one job per app and test type (all builds on the same runner, rounds interleaved), with
#            TechEmpower's verification of every build; PostgreSQL is TechEmpower's own image, built and
#            started by the harness from the pinned FrameworkBenchmarks commit (a `services:` container
#            can't be built from its dockerfile, and the harness pins it to its CPUs).
#   report   results.md (this run's summary) and results.json.
#
# It gates no merge, but the report fails when a required build doesn't build, a build fails TechEmpower's
# verification or answers differently from NativeAOT, or an image doesn't serve. While csharpc can't build
# the entry (csharpc_may_fail in harness.py), that is reported with its blockers, not a failure.
# Builds csharpc from this commit (not the published tool): the numbers must reflect the tree.
# No branch filter: any branch whose push touches the paths below runs it, including a ci/** branch.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per load level (TechEmpower: 15)'
        default: '15'
      rounds:
        description: 'Rounds per build (NativeAOT and csharpc; the JIT runs once)'
        default: '3'
      profile:
        description: 'Sample the NativeAOT and csharpc servers with perf at plaintext 256 and json 256 (unstripped builds)'
        type: boolean
        default: false
      only:
        description: 'Builds (aot,csharpc,jit)'
        default: 'aot,csharpc,jit'
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the benchmarks
  push:
    paths: ["benchmarks/techempower/**", ".github/workflows/techempower.yml"]

permissions:
  contents: read

concurrency:
  group: techempower-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DURATION: ${{ inputs.duration || '15' }}
  PROFILE: ${{ inputs.profile && '1' || '0' }}

jobs:
  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [platform, interim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 18, clang and NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang-18 libllvm18 lld-18 zlib1g-dev && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Build NativeAOT, csharpc and JIT, and their images
        run: |
          python3 benchmarks/techempower/harness.py build --app ${{ matrix.app }} --out build --only "${{ inputs.only || 'aot,csharpc,jit' }}" --images
          tar -czf build-${{ matrix.app }}.tgz build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: techempower-build-${{ matrix.app }}
          path: build-${{ matrix.app }}.tgz

  measure:
    name: measure (${{ matrix.app }}, ${{ matrix.test }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        app: [platform]
        test: [deploy, plaintext, json, db, query, fortune, update, cached-query]
        include:
          - { app: interim, test: deploy }
          - { app: interim, test: plaintext }
          - { app: interim, test: json }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Install wrk, siege and TechEmpower's verification dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y wrk siege python3-requests python3-colorama python3-psycopg2
          # TechEmpower's server settings (docker_helper: somaxconn 65535); 16384 connections from one address,
          # from ephemeral ports above the servers' (8080-8279).
          sudo sysctl -w net.core.somaxconn=65535 net.ipv4.tcp_max_syn_backlog=65535 net.ipv4.ip_local_port_range="10000 65535"

      - name: Install perf
        if: ${{ inputs.profile }}
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-azure linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: techempower-build-${{ matrix.app }}

      - name: Runner
        run: |
          {
            echo "## Runner"
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
            free -h | head -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and load
        run: |
          tar -xzf build-${{ matrix.app }}.tgz
          ulimit -n 65535 || true
          python3 benchmarks/techempower/harness.py measure --app ${{ matrix.app }} --builds build --test ${{ matrix.test }} --out measure --rounds "${{ inputs.rounds || '3' }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: techempower-measure-${{ matrix.app }}-${{ matrix.test }}
          path: measure/

  report:
    needs: [build, measure]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: techempower-*
          path: artifacts

      - name: Report
        run: |
          for t in artifacts/techempower-build-*/*.tgz; do mkdir -p "${t%.tgz}" && tar -xzf "$t" -C "${t%.tgz}" --exclude='*/aot/*' --exclude='*/jit/*' --exclude='*/csharpc/*'; done
          python3 benchmarks/techempower/harness.py report --out techempower-results artifacts || status=$?
          cat techempower-results/results.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "${status:-0}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: techempower
          path: techempower-results/
