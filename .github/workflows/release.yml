name: Release

# Builds NativeAOT platform bundles (libLLVM bundled; clang/lld remain a system prerequisite),
# smoke-tests each on a runner without the .NET SDK, then publishes a GitHub Release, the
# csharpc dotnet tool to GitHub Packages, and a container image to ghcr.io.
on:
  push:
    tags: ["v*"]
    # Temporary: exercise build+smoke on the packaging branch (publish job is tag-only).
    # Remove this branch filter after the first real release lands on main.
    branches: ["ci/release-packaging"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test only (do not publish release/packages)"
        type: boolean
        default: true


permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: linux
            runner: ubuntu-24.04
          - rid: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos
            runner: macos-15
          - rid: win-x64
            os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install LLVM 18, clang and lld (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang-18 libllvm18 lld-18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install LLVM 18 (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install llvm@18
          llvm="$(brew --prefix llvm@18)"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          echo "CSHARPC_LIBLLVM=$llvm/lib/libLLVM.dylib" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install LLVM-MinGW (Windows)
        if: matrix.os == 'windows'
        run: |
          curl -sSLf -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip
          echo "810703594a7e3eea03385b5329c7ea3bd65f5e496b44cf1b68c17ff436d265e7  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          bin="$(cygpath -w "$RUNNER_TEMP/llvm-mingw-20240619-ucrt-x86_64/bin")"
          echo "$bin" >> "$GITHUB_PATH"
          echo "CSHARPC_LIBLLVM=$bin\\libLLVM-18.dll" >> "$GITHUB_ENV"

      - name: Install .NET 11 SDK
        if: matrix.os != 'windows'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Install .NET 11 SDK (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -JsonFile global.json -InstallDir "$env:USERPROFILE\.dotnet11"
          "$env:USERPROFILE\.dotnet11" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$env:USERPROFILE\.dotnet11" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Pack release bundle
        run: |
          chmod +x tools/pack-release.sh
          if [[ ${{ github.ref }} == refs/tags/v* ]]; then
            export CSHARPC_VERSION="${GITHUB_REF_NAME#v}"
          fi
          tools/pack-release.sh "${{ matrix.rid }}" "$PWD/artifacts/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.rid }}
          path: artifacts/release/csharpc-*-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: smoke (${{ matrix.rid }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: linux
            runner: ubuntu-24.04
          - rid: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos
            runner: macos-15
          - rid: win-x64
            os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      # Samples' .expected files only — no .NET SDK on this job (the bundle must run alone).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/samples
            tools/smoke-release.sh
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.rid }}
          path: bundles

      # clang compiles csrt and drives the link; libLLVM is inside the bundle. Do not install the
      # .NET SDK here — that is the point of the smoke job.
      - name: Install clang and lld only (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install clang (macOS Homebrew llvm@18)
        if: matrix.os == 'macos'
        run: |
          brew install llvm@18
          llvm="$(brew --prefix llvm@18)"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install LLVM-MinGW clang only (Windows)
        if: matrix.os == 'windows'
        run: |
          curl -sSLf -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip
          echo "810703594a7e3eea03385b5329c7ea3bd65f5e496b44cf1b68c17ff436d265e7  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          bin="$(cygpath -w "$RUNNER_TEMP/llvm-mingw-20240619-ucrt-x86_64/bin")"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Assert .NET SDK is not required
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            echo "warning: runner image ships dotnet at $(command -v dotnet); smoke still only runs the bundled binary"
          else
            echo "no dotnet on PATH (good)"
          fi

      - name: Smoke-test bundle
        run: |
          chmod +x tools/smoke-release.sh
          archive=$(ls bundles/csharpc-*-${{ matrix.rid }}.tar.gz bundles/csharpc-*-${{ matrix.rid }}.zip 2>/dev/null | head -1)
          test -n "$archive"
          tools/smoke-release.sh "$archive" "$PWD"

  publish:
    name: publish
    needs: smoke
    # Only real version tags publish. Branch pushes and dry-run dispatches stop after smoke.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Install .NET 11 SDK (for packing the tool)
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Collect assets and SHA256SUMS
        id: assets
        run: |
          mkdir -p release-assets
          cp bundles/csharpc-*.tar.gz bundles/csharpc-*.zip release-assets/ 2>/dev/null || true
          cp bundles/csharpc-*.sizes.txt release-assets/ 2>/dev/null || true
          cd release-assets
          sha256sum csharpc-*.tar.gz csharpc-*.zip > SHA256SUMS
          cat SHA256SUMS
          ls -lh
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Tags with a prerelease suffix (-spike, -alpha, -test.N, …) become GitHub prereleases.
          if [[ ${GITHUB_REF_NAME} == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: csharpc ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.assets.outputs.prerelease }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-assets/*.sizes.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack and push csharpc dotnet tool to GitHub Packages
        run: |
          mkdir -p nupkg
          dotnet pack src/Csharpc -c Release -o nupkg -p:CsharpcReadyToRun=false
          ls -lh nupkg
          dotnet nuget push nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/jonathanperis/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # Container decision: ship ghcr.io/jonathanperis/csharpc so users who do not want a local
      # LLVM/clang install can `docker run … csharpc app.cs`. The image is linux/amd64 only (the
      # linux-x64 bundle plus apt clang/lld); multi-arch can follow once arm64 runners pack the
      # same layout. Size is dominated by libLLVM (~100 MiB) plus the NativeAOT binary.
      - name: Prepare docker-bundle context
        run: |
          mkdir -p docker-bundle
          tar -xzf release-assets/csharpc-*-linux-x64.tar.gz -C docker-bundle --strip-components=1
          test -x docker-bundle/csharpc
          test -d docker-bundle/lib

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push container image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/jonathanperis/csharpc:${{ github.ref_name }}
            ghcr.io/jonathanperis/csharpc:latest
