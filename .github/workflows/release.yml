name: Release

# Builds NativeAOT platform bundles + RID-specific tool packages, smoke-tests them, then
# publishes a GitHub Release, GitHub Packages, and (when configured) nuget.org.
#
# nuget.org Trusted Publishing: NuGet/login + push live in THIS file (release.yml). The OIDC
# job_workflow_ref claim is the workflow that REQUESTS the token — a reusable workflow called
# from ci.yml would claim the shared workflow's path, not release.yml, and nuget.org would
# reject it (NuGet/login#6). So publish stays here, triggered by workflow_run after CI.
# Policy (Active): Owner jonathanperis | Repo csharpc | Workflow File release.yml | Environment (empty)
# | Package glob *. Repo variable: NUGET_USER = nuget.org profile name (Jonathanperis).
# Never push *test*/*dryrun* versions (nuget.org cannot delete packages).
#
# Triggers:
#   - After CI succeeds on main (workflow_run): rolling prerelease `latest-main`, package
#     version 0.1.0-spike.<ci_run_number>. Does not run inside ci.yml, so it never cancels
#     or slows the five merge-bar jobs.
#   - Push of v* tags: named release + package version from the tag.
#   - workflow_dispatch: dry-run by default (build+smoke only).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test only (do not publish)"
        type: boolean
        default: true
      version:
        description: "Package version override (empty: from csproj / tag)"
        type: string
        required: false
        default: ""

# NuGet Trusted Publishing (OIDC) requires id-token on THIS workflow file (release.yml).
# A policy on nuget.org must name workflow file `release.yml` (no GitHub environment).
permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # Decide whether to run and which version/channel to publish.
  setup:
    name: setup
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.meta.outputs.should_run }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish_nuget_org: ${{ steps.meta.outputs.publish_nuget_org }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WR_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WR_RUN_NUMBER: ${{ github.event.workflow_run.run_number || '' }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          NUGET_USER: ${{ vars.NUGET_USER || '' }}
        run: |
          set -euo pipefail
          csproj_ver="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/Csharpc/Csharpc.csproj | head -1)"
          should_run=false
          should_publish=false
          channel=none
          version="$csproj_ver"
          release_tag=""
          prerelease=true
          sha="$SHA"

          if [[ $EVENT_NAME == workflow_run ]]; then
            if [[ $WR_CONCLUSION == success && $WR_BRANCH == main ]]; then
              should_run=true
              should_publish=true
              channel=main
              version="0.1.0-spike.${WR_RUN_NUMBER}"
              release_tag=latest-main
              prerelease=true
              sha="$WR_SHA"
            fi
          elif [[ $EVENT_NAME == push && $REF_NAME == v* ]]; then
            should_run=true
            should_publish=true
            channel=tag
            version="${REF_NAME#v}"
            release_tag="$REF_NAME"
            if [[ $version == *-* ]]; then prerelease=true; else prerelease=false; fi
            sha="$SHA"
          elif [[ $EVENT_NAME == workflow_dispatch ]]; then
            should_run=true
            should_publish=$([[ $DRY_RUN == true || $DRY_RUN == True ]] && echo false || echo true)
            channel=dispatch
            version="${VERSION_OVERRIDE:-$csproj_ver}"
            release_tag="v${version}"
            if [[ $version == *-* ]]; then prerelease=true; else prerelease=false; fi
          fi

          # nuget.org: Trusted Publishing via NuGet/login in this file (release.yml, no environment).
          # Never push test/dryrun versions (nuget.org cannot delete packages, only unlist).
          publish_nuget_org=false
          if [[ $should_publish == true && -n ${NUGET_USER} ]]; then
            if [[ $version == *test* || $version == *dryrun* || $channel == dispatch ]]; then
              echo "nuget.org: skipping version '$version' (test/dry-run; not deletable on nuget.org)"
            else
              publish_nuget_org=true
            fi
          fi

          {
            echo "should_run=$should_run"
            echo "should_publish=$should_publish"
            echo "version=$version"
            echo "channel=$channel"
            echo "release_tag=$release_tag"
            echo "prerelease=$prerelease"
            echo "publish_nuget_org=$publish_nuget_org"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Publish setup: run=$should_run publish=$should_publish channel=$channel version=$version tag=$release_tag nuget.org=$publish_nuget_org sha=$sha"

  build:
    name: build (${{ matrix.rid }})
    needs: setup
    if: needs.setup.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: linux
            runner: ubuntu-24.04
          - rid: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos
            runner: macos-15
          - rid: win-x64
            os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Install LLVM 18, clang and lld (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y llvm-18 clang-18 libllvm18 lld-18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install LLVM 18 (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install llvm@18
          llvm="$(brew --prefix llvm@18)"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          echo "CSHARPC_LIBLLVM=$llvm/lib/libLLVM.dylib" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install LLVM-MinGW (Windows)
        if: matrix.os == 'windows'
        run: |
          curl -sSLf -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip
          echo "810703594a7e3eea03385b5329c7ea3bd65f5e496b44cf1b68c17ff436d265e7  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          bin="$(cygpath -w "$RUNNER_TEMP/llvm-mingw-20240619-ucrt-x86_64/bin")"
          echo "$bin" >> "$GITHUB_PATH"
          echo "CSHARPC_LIBLLVM=$bin\\libLLVM-18.dll" >> "$GITHUB_ENV"

      - name: Install .NET 11 SDK
        if: matrix.os != 'windows'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Install .NET 11 SDK (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -JsonFile global.json -InstallDir "$env:USERPROFILE\.dotnet11"
          "$env:USERPROFILE\.dotnet11" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$env:USERPROFILE\.dotnet11" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Pack release bundle and RID tool package
        run: |
          chmod +x tools/pack-release.sh
          export CSHARPC_VERSION='${{ needs.setup.outputs.version }}'
          tools/pack-release.sh "${{ matrix.rid }}" "$PWD/artifacts/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.rid }}
          path: |
            artifacts/release/csharpc-*-${{ matrix.rid }}.*
            artifacts/release/nupkg/csharpc.${{ matrix.rid }}.*.nupkg
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: smoke (${{ matrix.rid }})
    needs: [setup, build]
    if: ${{ !cancelled() && needs.setup.outputs.should_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: linux
            runner: ubuntu-24.04
          - rid: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos
            runner: macos-15
          - rid: win-x64
            os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}
          sparse-checkout: |
            tests/samples
            tools/smoke-release.sh
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.rid }}
          path: bundles

      - name: Install clang and lld only (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang && sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install clang (macOS Homebrew llvm@18)
        if: matrix.os == 'macos'
        run: |
          brew install llvm@18
          llvm="$(brew --prefix llvm@18)"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install LLVM-MinGW clang only (Windows)
        if: matrix.os == 'windows'
        run: |
          curl -sSLf -o "$RUNNER_TEMP/llvm-mingw.zip" https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip
          echo "810703594a7e3eea03385b5329c7ea3bd65f5e496b44cf1b68c17ff436d265e7  $RUNNER_TEMP/llvm-mingw.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          bin="$(cygpath -w "$RUNNER_TEMP/llvm-mingw-20240619-ucrt-x86_64/bin")"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Smoke-test bundle
        run: |
          chmod +x tools/smoke-release.sh
          # nullglob: under pipefail, `ls missing-glob` exits 2 when the .zip/.tar.gz pattern is absent.
          shopt -s nullglob
          archives=(bundles/csharpc-*-${{ matrix.rid }}.tar.gz bundles/csharpc-*-${{ matrix.rid }}.zip)
          echo "bundles:"; ls -la bundles || true
          archive="${archives[0]:-}"
          test -n "$archive" || { echo "no archive for ${{ matrix.rid }}"; exit 1; }
          echo "using $archive"
          tools/smoke-release.sh "$archive" "$PWD"

  publish:
    name: publish
    needs: [setup, smoke]
    if: needs.setup.outputs.should_publish == 'true' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: true

      - name: Install .NET 11 SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --jsonfile global.json --install-dir "$HOME/.dotnet11"
          echo "$HOME/.dotnet11" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet11" >> "$GITHUB_ENV"

      - name: Collect assets, pointer package, SHA256SUMS
        run: |
          set -euo pipefail
          VERSION='${{ needs.setup.outputs.version }}'
          mkdir -p release-assets nupkg
          # Artifacts preserve the upload path: archives at bundles/, RID nupkgs at bundles/nupkg/.
          shopt -s nullglob
          cp bundles/csharpc-*.tar.gz bundles/csharpc-*.zip release-assets/ 2>/dev/null || true
          cp bundles/csharpc-*.sizes.txt release-assets/ 2>/dev/null || true
          # Flatten RID packages whether download-artifact left them nested or flat.
          while IFS= read -r -d '' pkg; do
            cp "$pkg" nupkg/
          done < <(find bundles -type f -name 'csharpc.*.nupkg' -print0)
          ls -la bundles bundles/nupkg nupkg || true
          test "$(find nupkg -maxdepth 1 -name 'csharpc.*.nupkg' | wc -l)" -ge 4 \
            || { echo "expected ≥4 RID nupkgs under nupkg/"; find bundles -type f -name '*.nupkg' -print; exit 1; }
          chmod +x tools/pack-tool-pointer.sh
          tools/pack-tool-pointer.sh "$VERSION" "$PWD/nupkg"
          cp nupkg/csharpc."$VERSION".nupkg release-assets/
          cd release-assets
          sha256sum csharpc-*.tar.gz csharpc-*.zip csharpc."$VERSION".nupkg > SHA256SUMS 2>/dev/null \
            || sha256sum csharpc-*.tar.gz csharpc-*.zip > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Attest release archives
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          target_commitish: ${{ needs.setup.outputs.sha }}
          name: ${{ needs.setup.outputs.channel == 'main' && format('csharpc latest-main ({0})', needs.setup.outputs.version) || format('csharpc {0}', needs.setup.outputs.release_tag) }}
          generate_release_notes: ${{ needs.setup.outputs.channel == 'tag' }}
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.setup.outputs.channel == 'tag' && needs.setup.outputs.prerelease != 'true' }}
          body: ${{ needs.setup.outputs.channel == 'main' && format('Rolling main prerelease. Package version `{0}`. Assets replaced on every green main CI. Prefer a `v*` tag for a frozen release.', needs.setup.outputs.version) || '' }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-assets/*.sizes.txt
            release-assets/csharpc.*.nupkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push packages to GitHub Packages
        run: |
          set -euo pipefail
          # RID packages first, pointer last (install resolves RIDs from the pointer).
          for pkg in nupkg/csharpc.linux-*.nupkg nupkg/csharpc.osx-*.nupkg nupkg/csharpc.win-*.nupkg; do
            [[ -f $pkg ]] || continue
            dotnet nuget push "$pkg" \
              --source "https://nuget.pkg.github.com/jonathanperis/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done
          dotnet nuget push nupkg/csharpc."${{ needs.setup.outputs.version }}".nupkg \
            --source "https://nuget.pkg.github.com/jonathanperis/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # GHCR before nuget.org so a pointer-package rejection still ships the container image.
      - name: Prepare docker-bundle context
        run: |
          mkdir -p docker-bundle
          tar -xzf release-assets/csharpc-*-linux-x64.tar.gz -C docker-bundle --strip-components=1
          test -x docker-bundle/csharpc

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Container image tags
        id: image_tags
        run: |
          tags=$'ghcr.io/jonathanperis/csharpc:${{ needs.setup.outputs.version }}\nghcr.io/jonathanperis/csharpc:${{ needs.setup.outputs.release_tag }}'
          if [[ '${{ needs.setup.outputs.channel }}' == tag && '${{ needs.setup.outputs.prerelease }}' != true ]]; then
            tags+=$'\nghcr.io/jonathanperis/csharpc:latest'
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: NuGet.org Trusted Publishing login
        id: nuget_login
        if: needs.setup.outputs.publish_nuget_org == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages to nuget.org
        if: needs.setup.outputs.publish_nuget_org == 'true'
        run: |
          set -euo pipefail
          KEY='${{ steps.nuget_login.outputs.NUGET_API_KEY }}'
          test -n "$KEY" || { echo "nuget.org: empty NUGET_API_KEY from NuGet/login"; exit 1; }
          for pkg in nupkg/csharpc.linux-*.nupkg nupkg/csharpc.osx-*.nupkg nupkg/csharpc.win-*.nupkg; do
            [[ -f $pkg ]] || continue
            dotnet nuget push "$pkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          dotnet nuget push nupkg/csharpc."${{ needs.setup.outputs.version }}".nupkg \
            --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: nuget.org skipped (test/dry-run or NUGET_USER unset)
        if: needs.setup.outputs.publish_nuget_org != 'true'
        run: |
          echo "nuget.org publish skipped (NUGET_USER unset, or version is a test/dry-run)."
          echo "Real pushes: main rolling 0.1.0-spike.<ci_run> or tag v* (first: v0.1.0-spike)."
          echo "Policy: Jonathanperis/csharpc-release → release.yml, no environment, vars.NUGET_USER."
