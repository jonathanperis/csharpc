name: GC nursery

# The opt-in generational nursery (--gc-nursery, docs/adr/0004-memory-management.md) on Linux x86-64:
# the differential suite at -O0 and -O2 and the conformance corpus compiled with
# CSHARPC_GC_NURSERY=1, then the collection-heavy samples under CSRT_GC_STRESS. A missed write
# barrier frees a live object, which shows up as wrong output or a crash in these runs.
#
# CSRT_GC_NURSERY_MB=1 runs a minor collection every MiB of allocation instead of every 32 MiB, so
# the suite's small programs collect too (each minor scans the old objects stores dirtied, the
# coroutine frames, and promotes what it finds). This workflow is informational: it is not one of
# the `test (<platform>)` merge-bar jobs.
on:
  push:
    branches: [main, "ci/**"]
    paths: ['src/**', 'tests/**', '.github/workflows/nursery.yml', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nursery-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CSHARPC_GC_NURSERY: 1
  CSRT_GC_NURSERY_MB: 1

jobs:
  differential:
    name: nursery differential (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          os: linux

      - name: Differential suite, -O0 and -O2
        run: tests/run.sh --all-opts --shard ${{ matrix.shard }}/4

  suites:
    name: nursery conformance and GC stress
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          os: linux

      - name: Conformance corpus
        run: tests/conformance.sh -j 4

      # A collection (a minor, with a major every 32) at every 50th allocation slow path, on the
      # samples that keep references in coroutine frames, collections, spans and threads. Not the
      # allocation benchmarks 20_gc_binary_trees and 125_gc_under_threads: at this rate they outrun
      # the 300 s limit with or without the nursery (the differential jobs run them).
      - name: GC stress (collection-heavy samples)
        if: success() || failure()
        env:
          CSRT_GC_STRESS: 50
          CSHARPC_TEST_TIMEOUT: 300
        run: |
          failed=0
          for filter in nursery 21_gc_churn 310_gc_roots async await iterator yield span dictionary collection task \
                        120_threads threadstatic threadpool threading_timer thread_interrupt culture_threads threadlocal; do
            tests/run.sh --all-opts "$filter" || failed=1
          done
          exit $failed
