name: Program as IL

# The differential samples through csc first (ADR 0010, "The program as IL"; roadmap M5): each
# tests/samples/NNN.cs is built by the SDK (`dotnet build NNN.cs`, what `dotnet run` builds), csharpc
# compiles the resulting NNN.dll — Main included — from IL, and the program must print exactly the
# recorded .NET output (tests/run.sh --via-il). Linux x86-64, -O0 and -O2.
#
# Informational: it is not one of the `test (<platform>)` merge-bar jobs. A shard fails only on a
# sample that is not listed in tests/il-main-known-failures.txt (a regression) or on a listed one that
# now passes (take it off the list); the step summary reports the pass rate.
on:
  push:
    branches: [main, "ci/il-**"]
    paths: ['src/**', 'tests/**', '.github/workflows/il-main.yml', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: il-main-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CSHARPC_IL_JOBS: 4

jobs:
  via-il:
    name: program as IL (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          os: linux

      - name: Samples via csc -> IL -> csharpc, -O0 and -O2
        run: |
          tests/run.sh --via-il --all-opts --shard ${{ matrix.shard }}/4 | tee via-il.log || true
          bash tests/il-main-check.sh via-il.log tests/il-main-known-failures.txt "${{ matrix.shard }}/4" >> "$GITHUB_STEP_SUMMARY"
